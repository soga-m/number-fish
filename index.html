<!DOCTYPE html>
<html>
<head>
  <title>NUMBER FISH</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  
</head>


<body>
  <h1>🐟 NUMBER FISH</h1>
  <p>TARGET: <span id="target-number">20</span></p>
  <p id="clear-message"></p>
  
  <div class="status">
    <span>CORRECT: <span id="correct-count">0</span></span>
    <span>TIME: <span id="time-left">20</span>秒</span>
</div>

  <div class="game">
  <div class="fish" id="movement-target">🐟</div>
   <div class="ball ball1">18</div>
   <div class="ball ball2">2</div>
   <div class="ball ball3">7</div>
   <div class="ball ball4">5</div>
   <div class="ball ball5">9</div>
  
</div>
<button id="start-button">START</button> <!-- STARTボタン -->
<button id="undo-button">やり直し</button>
<button id="retry-button" style="display: none;">RETRY</button>
<script src="game.js"></script>
</body>
</html>
